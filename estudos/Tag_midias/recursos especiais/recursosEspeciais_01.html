<!DOCTYPE html>
<html lang="pt_br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apredendo uso de Recursos especiais -HTML</title>
  </head>
  <body>
    <header>
      <h1>Usando o datalist</h1>

      <label for="">Select Box: </label
      ><select name="browsers" id="">
        <option value="">Selecione um navegador:</option>
        <option value="chrome">hrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="safari">Safari</option>
        <option value="google">Google</option>
      </select>

      <br />
      <hr />
      <label for="">DataList: </label
      ><input list="browsers" type="search" name="search" id="" />
      <datalist id="browsers">
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="safari">Safari</option>
        <option value="google">Google</option>
      </datalist>
    </header>
  </body>
</html>
